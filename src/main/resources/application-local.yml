# local — Walking Skeleton과 인수 테스트의 "항상 실행" profile.
# docker로 띄운 MySQL을 그대로 사용한다(임베디드 DB로 대체하지 않는다).
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
